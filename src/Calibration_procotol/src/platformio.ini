; UNAGI モータノード (Seeed XIAO ESP32-C3)
;
; 同一バイナリを10台すべてに書き込みます。
; ノードIDと較正係数は NVS に保存されるので、個体ごとのビルドは不要です。
;
;   pio run -t upload                     ← 10台すべてに同じものを書く
;   pio device monitor                    ← シリアルで ID を設定
;
; 書き込み後、各ノードで1回だけ:
;   > id 3
;   > save
;
; Arduino core 2.x / 3.x のどちらでもコンパイルできるよう
; main.cpp 側にバージョンガードを入れてあります。

[env]
framework  = arduino
monitor_speed = 115200
build_flags =
    -I../common
    -DCORE_DEBUG_LEVEL=1

; --- Arduino core 2.x（公式プラットフォーム、安定） ---
[env:node]
platform = espressif32@^6.9.0
board    = seeed_xiao_esp32c3

; --- Arduino core 3.x を使う場合はこちら ---
; 公式の espressif32 は core 3.x に追従していないため pioarduino を使います。
; URL のバージョンは https://github.com/pioarduino/platform-espressif32/releases
; で最新を確認してください。
[env:node_core3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board    = seeed_xiao_esp32c3
