; ============================================================================
; UNAGI — 1プロジェクト2環境
;
;   env:node   →  src/node/main.cpp  だけをビルド（モータノード ×10）
;   env:head   →  src/head/main.cpp  だけをビルド（ヘッド）
;
; ★ default_envs = node を必ず残してください。
;   これが無いと `pio run -t upload` が全環境を順番に処理し、
;   同じ基板に node → head と続けて書き込んで上書きしてしまいます。
;
; ヘッドを書くときは環境を明示します:
;   VS Code : PROJECT TASKS → head → Upload
;   CLI     : pio run -e head -t upload
; ============================================================================

[platformio]
default_envs = node

[env]
platform      = espressif32@^6.9.0
board         = seeed_xiao_esp32c3
framework     = arduino
monitor_speed = 115200

; --- シリアルモニタ ---
; XIAO ESP32-C3 はネイティブUSB (USB CDC)。下の2つの define が無いと
; Serial の出力が UART0 (GPIO20/21) に行き、USB では何も見えません。
; monitor_eol = LF はファーム側が '\n' で行を区切っているので必須です。
; send_on_enter は Enter を押すまで送信を溜める設定です。これが無いと
; 1文字ずつ送られ、ゆっくり打つとコマンドが途中で切れます。
monitor_eol     = LF
monitor_echo    = yes
monitor_filters = send_on_enter

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

; ---------------- モータノード（10台に同じバイナリ） ----------------
[env:node]
build_src_filter = +<node/>

; ---------------- ヘッド ----------------
; ヘッドが ESP32-WROOM の基板なら、下の2行のコメントを外してください。
[env:head]
build_src_filter = +<head/>
; board       = esp32dev
; build_flags = -DCORE_DEBUG_LEVEL=1

; ---------------- Arduino core 3.x（通常は不要） ----------------
; 現状 core 2.x で問題なくビルドできているので無効化しています。
; pioarduino 版は esptool パッケージの展開が Windows で失敗することがあります
; （FileNotFoundError: [WinError 2]）。必要になったときだけ有効化してください。
;
; [env:node_core3]
; platform         = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
; build_src_filter = +<node/>
