; ============================================================================
; UNAGI_Calibration — 1プロジェクト2環境 (protocol v2)
;
;   env:node  →  src/node/main.cpp だけをビルド（モータノード ×10、同じバイナリ）
;   env:head  →  src/head/main.cpp だけをビルド（ヘッド = 電源監視 + ESP-NOW ゲートウェイ）
;
; ★ VS Code では、このフォルダ (UNAGI_Calibration) 自体を File → Open Folder で開く。
;   親フォルダや .code-workspace を開くと PlatformIO がプロジェクトを見失います。
;
; ★ 書き込みは必ず左の PROJECT TASKS の  node ▸ / head ▸  から。
;   下の青いステータスバーの → ボタンは default_envs (= node) にしか書きません。
; ============================================================================

[platformio]
default_envs = node

[env]
platform      = espressif32@^6.9.0      ; Arduino core 2.0.17（動作確認済みの版）
board         = seeed_xiao_esp32c3
framework     = arduino
monitor_speed = 115200
monitor_eol     = LF
monitor_echo    = yes
monitor_filters = send_on_enter
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

[env:node]
build_src_filter = +<node/>

[env:head]
build_src_filter = +<head/>
