; UNAGI firmware — one project, two environments.
;   VS Code: pick the env in the status bar (or PlatformIO sidebar -> Project Tasks -> head / node)
;   CLI:     pio run -e node -t upload --upload-port COM5
;            pio device monitor -e node --port COM5
;
; Platform: pioarduino = Arduino-ESP32 core 3.x (recommended, current IDF).
; The code also builds on PlatformIO's official core 2.x platform:
;   platform = espressif32

[platformio]
default_envs = node

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -DARDUINO_USB_MODE=1          ; XIAO C3: Serial = native USB CDC
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:head]
build_src_filter = +<head/>

[env:node]
build_src_filter = +<node/>
