; ============================================================================
; UNAGI_Calibration — 1プロジェクト2環境 (protocol v3 / RS-485)
;
;   env:node  →  src/node/main.cpp だけをビルド（モータノード ×10、同じバイナリ）
;   env:head  →  src/head/main.cpp だけをビルド（ヘッド = 電源監視 + RS-485 ゲートウェイ）
;
; ★ ヘッドとノードは必ず両方このファーム (v3) に。古い ESP-NOW 版 (v2) を新ノード基板に
;   書くと D2 が HIGH になりモータが全開で回ります（CHANGES_RS485.md 参照）。
;
; ★ VS Code では、このフォルダ (UNAGI_Calibration) 自体を File → Open Folder で開く。
;   親フォルダや .code-workspace を開くと PlatformIO がプロジェクトを見失います。
;
; ★ 書き込みは必ず左の PROJECT TASKS の  node ▸ / head ▸  から。
;   下の青いステータスバーの → ボタンは default_envs (= node) にしか書きません。
; ============================================================================

[platformio]
default_envs = node

[env]
platform      = espressif32@^6.9.0      ; Arduino core 2.0.17（動作確認済みの版）
board         = seeed_xiao_esp32c3
framework     = arduino
monitor_speed = 115200
monitor_eol     = LF
monitor_echo    = yes
monitor_filters = send_on_enter
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; ---- RS-485 の切り替え（必要なときだけ。ヘッドとノードで必ず同じに）----
    ; -DBUS_BAUD=500000      ; 既定 1000000。CRC エラーが多いとき
    ; -DBUS_HW_DE=0          ; 既定 1（UART が DE を自動制御）。DE が動かないとき

[env:node]
build_src_filter = +<node/>

[env:head]
build_src_filter = +<head/>

; ---- 校正用: ノードが WiFi AP "UNAGI-NODE-<id>" になり hall_calib_gui.py と直接話す ----
;   書き込み: PROJECT TASKS → node_calwifi ▸ Upload。校正が終わったら必ず node ▸ Upload で本番に戻す。
;   本番の env:node には WiFi のコードは一切入らない（#ifdef UNAGI_CAL_WIFI）。
[env:node_calwifi]
build_src_filter = +<node/>
build_flags =
    ${env.build_flags}
    -DUNAGI_CAL_WIFI=1
